<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Hoard{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/static/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a class="brand" href="/">Hoard</a>
      <nav class="navlinks">
        <a href="/" {% if section == 'movies' %}class="active"{% endif %}>Movies</a>
        <a href="/games" {% if section == 'games' %}class="active"{% endif %}>Games</a>
      </nav>
    </div>
    <nav class="actions">
      {% if section == 'games' %}
      <a class="button" href="/games/add">Add game</a>
      {% else %}
      <a class="button" href="/add">Add movie</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
